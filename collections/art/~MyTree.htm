//============================================================================
function isNetscape() 
{ return (navigator.appName.indexOf('Netscape') != -1); }

//============================================================================
function isFolder(node) 
{ return node.child.length>0; }

//============================================================================
function isOpen(node) 
{ return node.flags&fOpend; }


//============================================================================
function isSelected(node) 
{ return node.flags&fSelected; }

//============================================================================
function Select(node, flg) 
{ 
	if (flg) 
		node.flags |= fSelected; 
	else 
		node.flags &= ~fSelected; 
}

//============================================================================
function ExpandNode(node, flg) 
{ 
	if (flg) 
		node.flags |= fOpend; 
	else 
		node.flags &= ~fOpend; 
}


//============================================================================
function toggleNode() 
{ showNode=!showNode; }

//============================================================================
function toggleNodeRefresh() 
{ toggleNode(); redrawTree(); }

//============================================================================
function createNode(node)
{
        var line='<TABLE CELLSPACING="0" CELLPADDING="1" BORDER="0"><TR VALIGN="MIDDLE">';
        for(var j=node.indent;j>0;j--) line += imgSpace;
        line += '<TD>';

        if (isFolder(node))
        {
                line+='<a href="javascript:parent.clicked(\''+node.name+'\','+!isOpen(node)+')" ';

                if (isOpen(node))
                        line+='onMouseOver="window.status=\'Click to close.\'; return true;"';
                else
                        line+='onMouseOver="window.status=\'Click to open.\'; return true;"'; 

                line+='>';

                if (isOpen(node))
                        line+=imgFolderO+node.statusbar+'">';
                else
                        line+=imgFolderC+node.statusbar+'">';
                line+='</A>';
        }
	  //add Leaf
        else
                line+=imgLeaf+node.statusbar+'">';

        line+='</td>';

        if (isSelected(node))
                line+='<TD NOWRAP BGCOLOR="'+cSelBG+'"><FONT COLOR="'+cSelText+'">'+node.title+'</FONT>';
        else
        {
                if (node.href.indexOf('javascript:') == 0)
                {
                        line+='<TD NOWRAP><A HREF="'+node.href+'" onMouseOver="window.status=\''+node.statusbar+'\'; return true"';
                        line+='">'+node.title+'</A>';
                }
                else
                {
                        if (node.href.indexOf('://') != -1)
                                targetFrame = '_top';
                        
                        if (node.href=='')
                                line+='<TD NOWRAP>'+node.title;
                        else
                                line+='<TD NOWRAP><A HREF="'+node.href+'" onMouseOver="window.status=\''+node.statusbar+'\'; return true" target='+targetFrame+'>'+node.title+'</A>';
                }
        }
        line+='</TD></TR></TABLE>';
        return line;
}

//============================================================================
function createTree(fHTML, node)
{
        if (!node.html[node.flags]) node.html[node.flags] = createNode(node);
        fHTML.writeln(node.html[node.flags]);
        if (isOpen(node))
        {
                for(var i=0; i<node.child.length; i++) createTree(fHTML, node.child[i]);
        }
}

//============================================================================
function createNodeText(fHTML, node)
{
	fHTML.writeln('<TABLE CELLSPACING="0" CELLPADDING="1" BORDER="0"><TR VALIGN="MIDDLE"><TD NOWRAP>'+node.text+'</TD>'+imgSpace+'</TR></TABLE>');
        if (isOpen(node))
        {
                for(var i=0; i<node.child.length; i++) createNodeText(fHTML, node.child[i]);
        }
}

//============================================================================
function makeTree(fHTML, node1)
{
        fHTML.writeln(HMTLHeader);
        fHTML.writeln('<TABLE CELLSPACING="0" CELLPADDING="1" BORDER="0"><TR><TD NOWRAP>');
        createTree(fHTML, node1);
        fHTML.writeln('</TABLE>');

}

//============================================================================
function redrawTreeNow()
{
        if (!self.index) return;
                
        var fHTML = index.document;
        if (fHTML)
        {
                fHTML.open();
                fHTML.writeln(HTMLBaseTarget);
                fHTML.writeln(HTMLBody);
                makeTree(fHTML, rootNode);
                fHTML.close();
        }
}

//============================================================================
function redrawTree()
{
        setTimeout('redrawTreeNow()',50);
}

//============================================================================
function www_auscomp_com(iValue)
{
        this.length=iValue;
        return this;
}

//============================================================================
function setIndent(node,iValue)
{
        node.indent=iValue;
        for(var k=0; k<node.child.length; k++)
                setIndent(node.child[k], iValue+1);
}

//============================================================================
function createNodeObject(sName, sHREF, sTitle, sStatusbar, sText)
{
        this.name=sName;
        this.href=sHREF;
        this.title=sTitle;
        if (sStatusbar == '') sStatusbar=sText;
        this.statusbar=sStatusbar;
        this.text=sText;
        this.flags=0;
        this.indent=0;
        this.child = new www_auscomp_com(createNodeObject.arguments.length-5);
        for(var i=5; i<createNodeObject.arguments.length; i++)
                this.child[i-5] = createNodeObject.arguments[i];
                
        if (isFolder(this))
                this.html = new www_auscomp_com(4)
        else
                this.html = new www_auscomp_com(2)
}

//============================================================================
function select(rootNode, name) 
{
        var result=false;
        for(var i=0; !result && i<rootNode.child.length; i++)
                result = select(rootNode.child[i], name);
        
        if (!result)
        {
                result = (rootNode.name==name);
                if (result)
                {
                        Select(rootNode,true);
                        selectedNode = rootNode;
                }
        }else
                ExpandNode(rootNode,true);

        return result;
}


//============================================================================
function Open(name, flg, node)
{
        var result=false;
        if (!node) node = rootNode;

        for(var i=0; i<node.child.length; i++)
        {
                result = Open(name, flg, node.child[i]);
                if (result==true) break;
        }
        
        if (result==true || node.name==name)
        {
                if (node.name==name || flg) ExpandNode(node, flg);
                return true;
        }
        return false;
}

//============================================================================
function clicked(name, flg, node)
{
        Open(name, flg, node);
        redrawTree();
}
