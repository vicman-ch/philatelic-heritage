
<html>
<head>
<meta charset="iso-8859-1">
<title>Feedback Results</title>

<!-- Art on Stamps: translation selector (GitHub archive) -->
<style id="aos-archive-translate-style">
#aos-archive-translate{position:fixed;top:12px;right:12px;z-index:2147483000;background:#fff9eb;border:1px solid #b18b48;border-radius:5px;padding:5px 7px;box-shadow:0 2px 9px #0003;max-width:160px}
#aos-archive-translate .gt_selector{max-width:145px;width:100%;font:13px Arial,sans-serif;color:#12324d;background:#fff;border:1px solid #aaa;padding:5px}
@media(max-width:600px){#aos-archive-translate{top:5px;right:5px;padding:3px;max-width:120px}#aos-archive-translate .gt_selector{max-width:110px;font-size:12px}}
body{top:0!important}
</style>
</head>
<body bgcolor="#FFFF00">

<img src="vg_port0.jpg" name="animation" width="155" height="201">

<script>
var name_img = document.animation;
var num_images = 19;
var num_loaded_images = 0;
var frame = 1;
var timeout_id = null;
var images = new Array(num_images);

function count_images() {
  if (++num_loaded_images == num_images) animate();
}

for (var i = 0; i < num_images; i++) {
  images[i] = new Image();
  images[i].onload = count_images;
  images[i].src = "vg_port" + i + ".jpg";
}

function animate() {
  name_img.src = images[frame].src;
  frame = (frame + 1) % num_images;
  timeout_id = setTimeout(animate, 3000);
}

function stopAnimation() {
  if (timeout_id) clearTimeout(timeout_id);
  timeout_id = null;
}
</script>

<form>
<input type="button" value="Restart"
 onclick="if (timeout_id == null && num_loaded_images == num_images) animate()">
<input type="button" value="Stop"
 onclick="stopAnimation()">
</form>


<div id="aos-archive-translate" class="notranslate" translate="no" aria-label="Translate this page"></div>
<script>window.gtranslateSettings={default_language:'en',languages:['en','fr','de','es','it','pt','ro','ru','zh-CN'],wrapper_selector:'#aos-archive-translate',native_language_names:true,detect_browser_language:false};</script>
<script defer src="https://cdn.gtranslate.net/widgets/latest/dropdown.js"></script>
</body>
</html>
