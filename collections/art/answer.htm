
<html>
<head>
<meta charset="iso-8859-1">
<title>Feedback Results</title>
</head>
<body bgcolor="#FFFF00">

<img src="vg_port0.jpg" name="animation" width="155" height="201">

<script>
var name_img = document.animation;
var num_images = 19;
var num_loaded_images = 0;
var frame = 1;
var timeout_id = null;
var images = new Array(num_images);

function count_images() {
  if (++num_loaded_images == num_images) animate();
}

for (var i = 0; i < num_images; i++) {
  images[i] = new Image();
  images[i].onload = count_images;
  images[i].src = "vg_port" + i + ".jpg";
}

function animate() {
  name_img.src = images[frame].src;
  frame = (frame + 1) % num_images;
  timeout_id = setTimeout(animate, 3000);
}

function stopAnimation() {
  if (timeout_id) clearTimeout(timeout_id);
  timeout_id = null;
}
</script>

<form>
<input type="button" value="Restart"
 onclick="if (timeout_id == null && num_loaded_images == num_images) animate()">
<input type="button" value="Stop"
 onclick="stopAnimation()">
</form>

</body>
</html>
