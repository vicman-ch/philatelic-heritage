<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — Art on Stamps</title><meta name="description" content="Search the Art on Stamps collection of philatelic articles and artworks."><link rel="canonical" href="https://www.artonstamps.org/search.html"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#12314d;font:17px/1.6 Georgia,serif}header{background:#08294b;color:white;padding:23px max(20px,calc((100vw - 1050px)/2))}header a{color:#fff}main{max-width:1080px;margin:0 auto;padding:25px 22px 70px}h1{font-size:clamp(28px,4vw,42px);margin:0 0 4px}p{margin:5px 0 17px}.search-row{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 15px}.search-row input{font:18px Arial,sans-serif;flex:1 1 250px;min-width:0;padding:13px;border:1px solid #9aabb8;border-radius:5px}.search-row button{font:17px Arial,sans-serif;padding:12px 24px;border:0;border-radius:5px;background:#08294b;color:white;cursor:pointer}.result{padding:17px 0;border-bottom:1px solid #d5c8b6}.result a{font-size:20px;color:#06487b;font-weight:bold}.result small{display:block;color:#65707b;overflow-wrap:anywhere}.result p{font:15px/1.6 Georgia,serif;margin:7px 0}.result mark{background:#f8e29c}.meta{color:#596877;font:14px Arial,sans-serif}footer{text-align:center;color:#556373;font:13px Georgia,serif;padding:20px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #b78b43;outline-offset:2px}
</style></head><body><header><a href="index.html">← Art on Stamps — Home</a></header><main><h1>Search Art on Stamps</h1><p>Search article titles and text throughout the collection.</p><form id="form" class="search-row" role="search"><input id="q" name="q" type="search" aria-label="Search the collection" placeholder="Artist, country, painting, stamp…" required><button type="submit">Search</button></form><div id="status" class="meta" aria-live="polite">Enter a word or phrase to search.</div><div id="results"></div></main><footer>Art on Stamps · <a href="index.html">Home</a></footer><script>
(()=>{'use strict';const form=document.getElementById('form'),q=document.getElementById('q'),status=document.getElementById('status'),out=document.getElementById('results');let dbPromise=null;
function norm(s){return s.toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function load(){if(!dbPromise)dbPromise=fetch('aos-search-index.json').then(r=>{if(!r.ok)throw Error('Index unavailable');return r.json()});return dbPromise}
function render(){const query=q.value.trim();history.replaceState(null,'',query?'?q='+encodeURIComponent(query):location.pathname);out.replaceChildren();if(!query){status.textContent='Enter a word or phrase to search.';return}status.textContent='Searching…';const terms=norm(query).split(/\s+/).filter(Boolean);load().then(db=>{const matches=[];for(const item of db){const title=norm(item.t),body=norm(item.d);if(!terms.every(t=>title.includes(t)||body.includes(t)))continue;const score=terms.reduce((s,t)=>s+(title.includes(t)?12:0)+(body.includes(t)?1:0),0);matches.push({item,score})}matches.sort((a,b)=>b.score-a.score||a.item.t.localeCompare(b.item.t));status.textContent=matches.length+' matching pages'+(matches.length>100?' · showing first 100':'');for(const {item} of matches.slice(0,100)){const div=document.createElement('article');div.className='result';const link=document.createElement('a');link.href=item.u;link.textContent=item.t;div.append(link);const small=document.createElement('small');small.textContent=item.u;div.append(small);const p=document.createElement('p');const low=norm(item.d);let pos=Math.min(...terms.map(t=>{let n=low.indexOf(t);return n<0?Infinity:n}));if(!isFinite(pos))pos=0;const start=Math.max(0,pos-95),end=Math.min(item.d.length,pos+230);p.textContent=(start?'…':'')+item.d.slice(start,end)+(end<item.d.length?'…':'');div.append(p);out.append(div)}}).catch(()=>{status.textContent='Search index could not be loaded. Please try again later.'})}
form.addEventListener('submit',e=>{e.preventDefault();render()});const initial=new URLSearchParams(location.search).get('q');if(initial){q.value=initial;render()}
})();
</script></body></html>
