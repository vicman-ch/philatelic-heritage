<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search the Collection | Art on Stamps</title><meta name="robots" content="noindex,follow"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#163550;font:16px/1.55 Georgia,serif}header{background:#08294b;color:#fff;padding:22px max(18px,calc((100% - 980px)/2))}header a{color:#e8bb61}h1{margin:0 0 10px;font:normal 31px Georgia,serif}main{max-width:980px;margin:auto;padding:25px 18px 60px}.searchform{display:flex;gap:8px;margin:16px 0 12px}.searchform input{flex:1;min-width:0;padding:12px;border:1px solid #b7bec4;border-radius:4px;font:16px Arial,sans-serif}.searchform button,.more{background:#0c4578;color:white;border:0;border-radius:4px;padding:12px 18px;cursor:pointer;font:700 14px Arial,sans-serif}.searchform button:hover,.more:hover{background:#12639f}.result{padding:17px 0;border-bottom:1px solid #d8d4cc}.result h2{font:normal 22px Georgia,serif;margin:0 0 4px}.result a{color:#11538b}.result p{margin:5px 0;color:#35485a;overflow-wrap:anywhere}.result small{font:12px Arial,sans-serif;color:#667789;overflow-wrap:anywhere}.meta{font:14px Arial,sans-serif;color:#56667a;margin:15px 0}.more{margin:22px 0}.hidden{display:none}mark{background:#fff0a4;color:inherit}#status{min-height:20px}@media(max-width:550px){header{padding:18px}h1{font-size:26px}.result h2{font-size:19px}}</style></head><body><header><h1>Art on Stamps — Search the Collection</h1><a href="index.html">← Return to Art on Stamps</a></header><main><form class="searchform" id="search-form"><input id="q" name="q" type="search" minlength="2" required placeholder="Artist, artwork, stamp, country…" aria-label="Search the collection"><button>Search</button></form><p class="meta" id="status" role="status" aria-live="polite">Enter a search term to explore the archive.</p><div id="results"></div><button id="more" class="more hidden" type="button">Show more results</button></main><script>
'use strict';
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search), q=$('q'), results=$('results'),status=$('status'),more=$('more');
let indexPromise=null, matches=[],visible=0, terms=[];
function fold(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function tokenize(s){return fold(s).match(/[\p{L}\p{N}]+/gu)||[]}
function safeHighlight(text){const fragment=document.createDocumentFragment();if(!terms.length){fragment.append(text);return fragment}const low=fold(text);let cursor=0;while(cursor<text.length){let best=-1,match='';for(const term of terms){const pos=low.indexOf(term,cursor);if(pos>=0&&(best<0||pos<best)){best=pos;match=term}}if(best<0){fragment.append(text.slice(cursor));break}if(best>cursor)fragment.append(text.slice(cursor,best));const mark=document.createElement('mark');mark.textContent=text.slice(best,best+match.length);fragment.append(mark);cursor=best+match.length}return fragment}
function snippet(body){const low=fold(body);let first=-1;for(const t of terms){const i=low.indexOf(t);if(i>=0&&(first<0||i<first))first=i}let start=Math.max(0,first-95);if(first<0)start=0;const end=Math.min(body.length,start+285);return (start?'…':'')+body.slice(start,end)+(end<body.length?'…':'')}
function renderNext(){const end=Math.min(matches.length,visible+25);const frag=document.createDocumentFragment();for(let i=visible;i<end;i++){const x=matches[i].doc;const div=document.createElement('article');div.className='result';const h=document.createElement('h2'),a=document.createElement('a');a.href=x.u;a.textContent=x.t;h.append(a);div.append(h);const small=document.createElement('small');small.textContent=x.u;div.append(small);const p=document.createElement('p');p.append(safeHighlight(snippet(x.b)));div.append(p);frag.append(div)}results.append(frag);visible=end;more.classList.toggle('hidden',visible>=matches.length)}
more.addEventListener('click',renderNext);
async function runSearch(raw){const query=raw.trim();results.replaceChildren();more.classList.add('hidden');if(query.length<2){status.textContent='Please enter at least two characters.';return}terms=[...new Set(tokenize(query))].filter(t=>t.length>=2);if(!terms.length){status.textContent='Please enter a word or name.';return}status.textContent='Searching the archive…';try{indexPromise ||= fetch('aos-search-index.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});const docs=await indexPromise;matches=[];const phrase=fold(query);for(const doc of docs){const t=fold(doc.t),b=fold(doc.b),u=fold(doc.u);if(!terms.every(x=>t.includes(x)||b.includes(x)||u.includes(x)))continue;let score=(t.includes(phrase)?120:0)+(b.includes(phrase)?25:0);for(const term of terms){score+=(t.split(term).length-1)*30+(u.includes(term)?12:0)+Math.min(12,b.split(term).length-1)*2}matches.push({doc,score})}matches.sort((a,b)=>b.score-a.score||a.doc.t.localeCompare(b.doc.t));visible=0;status.textContent=matches.length+' '+(matches.length===1?'page found':'pages found')+' for “'+query+'” (searched '+docs.length+' archived pages).';renderNext()}catch(err){status.textContent='The search index could not be loaded. Please try again later.';console.error(err)}}
$('search-form').addEventListener('submit',e=>{e.preventDefault();const val=q.value.trim();history.replaceState(null,'','?q='+encodeURIComponent(val));runSearch(val)});
const initial=params.get('q')||'';if(initial){q.value=initial;runSearch(initial)}
</script></body></html>
