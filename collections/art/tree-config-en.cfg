# Definition file for Aves NavTree - PASIS

# set the size
xsize = 200
ysize = 550

# display all links in the main window
target = main

scroll = true

# Decrease scale to allow more visible nodes
yscale = 19
xscale = 13

# Underline each link
underline = true

# Higlight selected link
highlight = 0,0,220

# Raisable buttons
 raise = 33,217,217

# Image to display for nodes without children
leafimage="Buttons/no-children.gif"

#Image to display for closed and opened nodes
 closedimage = "Buttons/closed-image.gif"
 openimage="Buttons/opened-image.gif"

# connect the icons with lines
showlines = true

scroll = true
autoclose = true
backgroundimage = peacocks.jpg
scalebackground = true
revealurl = true

fontname = SansSerif

# dark blue  text on a pink background
# text = 0,0,80
# background = 224,198,202
text = 0, 0, 0
background = 255, 245, 239

