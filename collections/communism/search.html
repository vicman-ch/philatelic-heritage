<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Search — Communism on Stamps</title><meta content="Search the archived Communism on Stamps articles." name="description"/><link href="assets/site.css" rel="stylesheet"/><link href="assets/cos-controls.css" rel="stylesheet"/><link href="assets/author-submenu.css" rel="stylesheet"/><script defer="" src="assets/cos-controls.js"></script><style>.search-wrap{max-width:1050px;margin:32px auto;padding:0 24px 55px}.search-wrap h1{font-size:clamp(28px,4vw,43px);color:#123e33}.search-wrap p{line-height:1.6}.search-row{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.search-row input{flex:1;min-width:210px;padding:13px 15px;border:2px solid #b9a78c;border-radius:5px;font-size:18px;background:#fff;color:#152d28}.search-row button{background:#8e171c;color:white;border:0;border-radius:5px;padding:12px 25px;font-size:17px;cursor:pointer}.result{background:#fffaf0;border:1px solid #d6c5aa;border-radius:7px;margin:14px 0;padding:17px 20px}.result a{color:#862027;font-size:20px;font-weight:bold}.result p{margin:8px 0 0;color:#253e36}.result small{color:#556b60;word-break:break-word}mark{background:#ffe59a;color:#252016}.status{font-size:15px;color:#455e53}</style></head><body><header class="masthead"><div class="brand"><span class="star">★</span><div><div class="brand-name">COMMUNISM ON STAMPS</div><div class="tagline">A Philatelic Journey Through a Changing World</div></div></div></header><nav aria-label="Main navigation" class="nav"><a href="index.html">Home</a><a href="intro.htm">Introduction</a><a href="articles-a-z.html">Articles A–Z</a><a aria-current="page" href="search.html">Search</a><details class="author-submenu"><summary>Author</summary><div class="author-submenu-links"><a href="Victor-Manta.htm">About</a><a href="feedback.html">Contact</a></div></details></nav><main class="search-wrap"><h1>Search the collection</h1><p>Search article titles and full text in the <em>Communism on Stamps</em> archive. Results open in a new tab.</p><form class="search-row" id="searchForm"><input aria-label="Search terms" autocomplete="off" id="q" placeholder="Enter names, countries, events…" required="" type="search"/><button type="submit">Search</button></form><p class="status" id="status" role="status">Loading the article index…</p><div id="results"></div></main><script>"use strict";
let pages = [];
const q = document.getElementById('q');
const status = document.getElementById('status');
const results = document.getElementById('results');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function snippet(s, terms) {
  const lower = s.toLowerCase();
  let i = Math.min(...terms.map(t => {const p = lower.indexOf(t); return p < 0 ? Infinity : p;}));
  if (!Number.isFinite(i)) i = 0;
  const start = Math.max(0, i - 90), end = Math.min(s.length, i + 190);
  return (start ? '…' : '') + s.slice(start, end) + (end < s.length ? '…' : '');
}
function highlight(s, terms) {
  const escaped = esc(s);
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}
function run() {
  const terms = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  results.innerHTML = '';
  if (!terms.length) { status.textContent = pages.length + ' indexed pages. Enter a word to search.'; return; }
  const matches = pages.map(p => {
    const title = String(p.title || '').toLowerCase(), body = String(p.text || '').toLowerCase();
    const score = terms.every(t => title.includes(t) || body.includes(t)) ?
      terms.reduce((n,t) => n + (title.includes(t) ? 10 : 0) + (body.includes(t) ? 1 : 0), 0) : -1;
    return {p,score};
  }).filter(x => x.score >= 0).sort((a,b) => b.score-a.score || a.p.title.localeCompare(b.p.title));
  status.textContent = matches.length + ' result' + (matches.length === 1 ? '' : 's') + ' found';
  for (const {p} of matches.slice(0,150)) {
    const d = document.createElement('article'); d.className='result';
    d.innerHTML = '<a target="_blank" rel="noopener" href="' + encodeURI(p.url).replace(/"/g,'%22') + '">' + highlight(p.title,terms) + '</a><p>' + highlight(snippet(p.text,terms),terms) + '</p><small>' + esc(p.url) + '</small>';
    results.appendChild(d);
  }
  if (matches.length > 150) status.textContent += ' (showing first 150)';
}
document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault(); run(); history.replaceState(null,'','?q='+encodeURIComponent(q.value.trim()));
});
fetch('communism-search-index.json').then(r => {if(!r.ok) throw Error('Index unavailable');return r.json();})
.then(data => {pages = data;status.textContent=pages.length+' indexed pages. Enter a word to search.';
  const init = new URLSearchParams(location.search).get('q');if(init){q.value=init;run();}
}).catch(() => {status.textContent='The search index could not be loaded. Please reload the page.';});</script></body></html>
