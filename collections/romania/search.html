<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — Romania on Stamps</title><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="modern.css?v=20261026-lot26"><style>

</style></head><body><div class="rs-search-page"><a class="back" href="index.html">← Romania on Stamps — Home</a><h1>Search the website</h1><form action="search.html" method="get" role="search"><input id="q" type="search" name="q" placeholder="Search articles…" aria-label="Search articles" required><button type="submit">Search</button></form><p id="status" role="status">Enter a word or phrase to search the articles on this website.</p><div id="results"></div></div><script>
(function(){'use strict';const input=document.getElementById('q'),status=document.getElementById('status'),out=document.getElementById('results');const q=(new URLSearchParams(location.search).get('q')||'').trim();input.value=q;if(!q)return;
status.textContent='Searching the local article index…';
fetch('romania-search-index.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('Index unavailable');return r.json()}).then(items=>{const terms=q.toLocaleLowerCase().split(/\s+/).filter(Boolean);const hits=[];for(const raw of items){const item={title:raw.t,text:raw.b,url:raw.u};const title=item.title.toLocaleLowerCase(),text=item.text.toLocaleLowerCase(),url=item.url.toLocaleLowerCase();if(!terms.every(t=>title.includes(t)||text.includes(t)||url.includes(t)))continue;const score=terms.reduce((s,t)=>s+(title.includes(t)?12:0)+(url.includes(t)?5:0)+(text.includes(t)?1:0),0);hits.push({...item,score})}hits.sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title));status.textContent=hits.length+' article'+(hits.length===1?'':'s')+' found for “'+q+'”.';for(const item of hits.slice(0,100)){const box=document.createElement('article');box.className='result';const a=document.createElement('a');a.href=item.url;a.textContent=item.title;box.append(a);const p=document.createElement('p');const low=item.text.toLocaleLowerCase();let pos=Math.min(...terms.map(t=>{const n=low.indexOf(t);return n<0?Infinity:n}));if(!Number.isFinite(pos))pos=0;const start=Math.max(0,pos-75);p.textContent=(start?'…':'')+item.text.slice(start,start+240)+(item.text.length>start+240?'…':'');box.append(p);const small=document.createElement('div');small.className='path';small.textContent=item.url;box.append(small);out.append(box)}if(hits.length>100){const p=document.createElement('p');p.textContent='Showing the first 100 results. Please refine your search.';out.append(p)}}).catch(()=>{status.textContent='The internal search index could not be loaded. Please try again later.'});})();
</script></body></html>
